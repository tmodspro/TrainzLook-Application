<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 220">
  <title>TrainzLook wordmark</title>
  <!-- Custom monoline geometric letters; stroke weight matches the rail web. x-height 80–180, caps 40–180. -->
  <g fill="none" stroke="#1E1F22" stroke-width="22" stroke-linejoin="miter" stroke-miterlimit="4">
    <path d="M0 51H96M48 40V180"/>
    <path d="M111 80V180M111 134Q111 91 154 91H160"/>
    <path d="M224 91A39 39 0 1 0 224 169A39 39 0 1 0 224 91ZM263 80V180"/>
    <path d="M301 80V180"/>
    <path d="M339 80V180M339 130A39 39 0 0 1 417 130V180"/>
    <path d="M561 40V169H628"/>
    <path d="M692 91A39 39 0 1 0 692 169A39 39 0 1 0 692 91Z"/>
    <path d="M806 91A39 39 0 1 0 806 169A39 39 0 1 0 806 91Z"/>
    <path d="M881 40V180"/>
  </g>
  <g fill="#1E1F22">
    <circle cx="301" cy="50" r="12"/>
