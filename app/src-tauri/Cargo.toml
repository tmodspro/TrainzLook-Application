[package]
name = "trainzlook"
version = "0.2.1"
description = "Blender-style viewer for Trainz meshes"
authors = ["INDORAILS"]
license = "UNLICENSED"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "trainzlook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
trainz-formats = { path = "../../crates/trainz-formats" }
notify = "8.2.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga", "bmp"] }
